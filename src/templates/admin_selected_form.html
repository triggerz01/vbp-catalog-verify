{% extends "base.html" %}{% block t %}中选记录表单{% endblock %}
{% block body %}
<h1>{{ '编辑中选记录' if s else '新增中选记录' }}</h1>
<div class="panel" style="max-width:560px">
<form method="post">
  <p>清单序号：<input name="seq_no" type="number" value="{{ s.seq_no if s else '' }}" {{ 'readonly' if s }} required></p>
  <p>药品名称：<input name="product_name" value="{{ s.product_name if s else '' }}" required size="30"></p>
  <p>剂型：<input name="dosage_form" value="{{ s.dosage_form if s else '' }}"></p>
  <p>规格：<input name="specification" value="{{ s.specification if s else '' }}" size="40"></p>
  <p>中选价（元）：<input name="price" type="number" step="0.01" min="0.01" value="{{ s.price if s else '' }}" required></p>
  <p>包装数量 / 单位：<input name="pack_qty" type="number" value="{{ s.pack_qty if s else 1 }}" size="6">
     <input name="pack_unit" value="{{ s.pack_unit if s else '盒' }}" size="4"></p>
  <p>企业：<select name="manufacturer_id">
    {% for m in mfrs %}<option value="{{m.manufacturer_id}}" {{ 'selected' if s and s.manufacturer_id==m.manufacturer_id }}>{{m.name}}</option>{% endfor %}
  </select></p>
  <p>备注：<select name="remark">
    {% for r in ['中选药品','备供药品','视同主供的中选药品'] %}
    <option value="{{r}}" {{ 'selected' if s and s.remark==r }}>{{r}}</option>{% endfor %}
  </select></p>
  <p>状态：<select name="status">
    <option value="有效" {{ 'selected' if s and s.status=='有效' }}>有效</option>
    <option value="失效" {{ 'selected' if s and s.status=='失效' }}>失效</option>
  </select></p>
  <p>供应省份（多选）：</p>
  <div class="chk">
    {% for p in ['北京','上海','山东','江苏','浙江','广东','四川','湖北','河南','辽宁','福建','安徽'] %}
    <label><input type="checkbox" name="provinces" value="{{p}}" {{ 'checked' if provs and p in provs }}>{{p}}</label>
    {% endfor %}
  </div>
  <p style="margin-top:14px"><button class="btn">保存</button>
     <a class="btn gray" href="{{ url_for('selected') }}">取消</a></p>
</form>
</div>
{% endblock %}
